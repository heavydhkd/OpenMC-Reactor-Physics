[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmc-reactor-physics"
version = "2.0.0"
description = "PWR 单栅元中子学-热工耦合、高斯过程代理模型与临界设计寻优"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenMC-Reactor-Physics contributors" }]
keywords = ["openmc", "monte-carlo", "nuclear-engineering", "surrogate-model", "gaussian-process"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "SALib>=1.4",
]

[project.optional-dependencies]
# OpenMC 走 conda-forge 安装，不能通过 pip 安装
openmc = ["openmc>=0.13.3"]
web = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/heavydhkd/OpenMC-Reactor-Physics"
Issues = "https://github.com/heavydhkd/OpenMC-Reactor-Physics/issues"

[tool.setuptools]
packages = ["src", "src.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["src/models/pin_cell.py"]
